    <style>
        /* lock-screen layout */
        #lock-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .lock-terminal {
            background: linear-gradient(180deg, rgba(0,255,102,0.04), transparent 30%),
                        rgba(3,10,6,0.92);
            border: 1px solid rgba(0,255,65,0.28);
            border-radius: 10px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.5) inset,
                        0 24px 60px rgba(0,0,0,0.8),
                        0 0 40px rgba(0,255,102,0.1);
            overflow: hidden;
        }
        .lock-body {
            padding: 1.1rem 1.3rem 1.4rem;
            font-size: 0.88rem;
            line-height: 1.75;
        }
        .lock-line {
            color: var(--text);
            display: block;
            margin: 0;
        }
        .lock-dim { color: var(--text-dim); }
        .lock-denied { color: #ff5f56; }
        .lock-prompt { color: var(--green-soft); font-weight: 700; }

        /* password input row */
        .lock-input-row {
            display: flex;
            align-items: center;
            gap: 0;
            margin-top: 0.1rem;
        }
        .lock-input-row .lock-prompt { margin-right: 0.5rem; white-space: nowrap; }
        .lock-sudo-label { color: var(--text-dim); margin-right: 0.4rem; white-space: nowrap; }
        #pwd {
            background: transparent;
            border: none;
            outline: none;
            color: var(--green-bright);
            font-family: var(--font);
            font-size: 0.88rem;
            caret-color: var(--green);
            flex: 1;
            min-width: 0;
            letter-spacing: 0.18em;
        }
        #pwd::placeholder { color: transparent; }

        /* status messages */
        #lock-msg {
            min-height: 1.4rem;
            margin-top: 0.5rem;
            font-size: 0.82rem;
            transition: opacity 0.2s;
        }
        #lock-msg.hidden   { opacity: 0; }
        #lock-msg.ok       { color: var(--green-bright); }
        #lock-msg.bad      { color: #ff5f56; }
        #lock-msg.working  { color: var(--text-dim); }

        /* shake on wrong password */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-8px); }
            40%      { transform: translateX(8px); }
            60%      { transform: translateX(-5px); }
            80%      { transform: translateX(5px); }
        }
        .lock-terminal.shake { animation: shake 0.38s ease; }

        /* blinking cursor */
        .lock-cursor {
            display: inline-block;
            width: 8px;
            height: 0.95em;
            background: var(--green);
            vertical-align: text-bottom;
            box-shadow: 0 0 6px rgba(0,255,102,0.7);
            animation: blink 1.1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>

    // ── matrix rain (lightweight, no boot sequence on lock page) ─────────────
    (function() {
        const canvas = document.getElementById('matrix');
        const ctx    = canvas.getContext('2d');
        const chars  = 'アカサタナハマヤラワ0123456789ABCDEF{}[]<>$#%&*'.split('');
        const fs     = 16;
        let cols, drops;
        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            cols  = Math.floor(canvas.width / fs);
            drops = Array(cols).fill(1).map(() => Math.random() * -50);
        }
        resize();
        window.addEventListener('resize', resize);
        setInterval(() => {
            ctx.fillStyle = 'rgba(4,7,5,0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fs + 'px monospace';
            drops.forEach((y, i) => {
                const ch = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillStyle = Math.random() > 0.97 ? '#aaffcc' : '#00ff66';
                ctx.fillText(ch, i * fs, y * fs);
                if (y * fs > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }, 55);
    })();

    const ITERS   = 310000;

    function b64ToBytes(b64) {
        const bin = atob(b64);
        return Uint8Array.from(bin, c => c.charCodeAt(0));
    }

    async function decrypt(password) {
        const enc  = new TextEncoder();
        const raw  = b64ToBytes(PAYLOAD);
        const salt = raw.slice(0, 16);
        const iv   = raw.slice(16, 28);
        const ct   = raw.slice(28);

        const keyMat = await crypto.subtle.importKey(
            'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: ITERS, hash: 'SHA-256' },
            keyMat,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
        );
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
        return new TextDecoder().decode(plain);
    }

    function setMsg(text, cls) {
        const el = document.getElementById('lock-msg');
        el.textContent  = text;
        el.className    = cls;
    }

    function shake() {
        const box = document.getElementById('lock-box');
        box.classList.remove('shake');
        void box.offsetWidth;   // reflow to restart animation
        box.classList.add('shake');
    }

    async function tryUnlock() {
        const password = pwd.value;
        if (!password) return;

        setMsg('Decrypting…', 'working');
        pwd.disabled = true;

        try {
            const html = await decrypt(password);
            setMsg('Access granted.', 'ok');
            // Brief flash before replacing the page
            setTimeout(() => {
                document.open();
                document.write(html);
                document.close();
            }, 280);
        } catch (_) {
            shake();
            setMsg('Access denied — wrong password.', 'bad');
            pwd.disabled = false;
            pwd.value    = '';
            pwd.focus();
        }
    }

    pwd.addEventListener('keydown', e => {
        if (e.key === 'Enter') tryUnlock();
    });
